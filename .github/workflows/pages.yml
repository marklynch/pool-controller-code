name: Deploy Website

# Publishes the project website to GitHub Pages at https://poolcontrol.io: a
# home page at the root, and the ESP Web Tools installer under /install/,
# serving the merged full-flash binaries from recent releases alongside it.
#
# The custom domain is set in Settings → Pages, not by a CNAME file — Pages
# ignores CNAME files in Actions-deployed artifacts. See docs/website.md.
#
# The page source lives in website/, deliberately NOT docs/ — GitHub Pages
# treats docs/ as a branch publishing directory, and pointing Pages at it
# serves the raw sources, which have no manifest.json and no firmware binary
# (both are produced here at deploy time). Keeping the sources out of docs/
# removes that trap: this workflow is the only way the site gets published.
#
# Pages must be configured with source "GitHub Actions" (Settings → Pages),
# not "Deploy from a branch".
#
# The workflow_run trigger is used rather than `release: published` because
# Build & Release publishes its draft with the built-in GITHUB_TOKEN, and
# events raised by that token never trigger further workflow runs — a release
# trigger would silently never fire.
on:
  # Tag builds: publish the release that was just built.
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  # Page edits: republish against the current latest release.
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # How many recent releases the installer offers in its version picker.
  INSTALLER_VERSIONS: 5

# Never run two deploys at once, and let an in-flight deploy finish rather
# than cancelling it — a half-published installer page is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires for every Build & Release run, including PR and
    # main-branch builds that produce no release. Only tag builds carry a
    # release to publish; on a tag push workflow_run.head_branch is the tag
    # name. push and workflow_dispatch always deploy, using the latest release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Always the newest INSTALLER_VERSIONS releases, whichever tag triggered
      # the run. Re-running an old tag's build therefore can't roll the public
      # installer back to that version.
      - name: Assemble site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./website/build-site.sh --out site --limit "${INSTALLER_VERSIONS:-5}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
