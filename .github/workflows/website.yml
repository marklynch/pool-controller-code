name: Deploy Website

# Publishes the project website to https://poolcontrol.io, an assets-only
# Cloudflare Worker (website/wrangler.toml): a home page at the root, and the
# ESP Web Tools installer under /install/, serving the merged full-flash
# binaries from recent releases alongside it.
#
# The site is assembled here rather than by a Cloudflare build, because
# build-site.sh needs the gh CLI and a GitHub token to fetch release assets.
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets on the
# "production" environment. See docs/website.md.
#
# The workflow_run trigger is used rather than `release: published` because
# Build & Release publishes its draft with the built-in GITHUB_TOKEN, and
# events raised by that token never trigger further workflow runs — a release
# trigger would silently never fire.
on:
  # Tag builds: publish the release that was just built.
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  # Page edits: republish against the current latest release.
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # How many recent releases the installer offers in its version picker.
  INSTALLER_VERSIONS: 5

# Never run two deploys at once, and let an in-flight deploy finish rather
# than cancelling it — a half-published installer page is worse than a stale one.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires for every Build & Release run, including PR and
    # main-branch builds that produce no release. Only tag builds carry a
    # release to publish; on a tag push workflow_run.head_branch is the tag
    # name. push and workflow_dispatch always deploy, using the latest release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    # The Cloudflare secrets live on this environment, not the repo, so they
    # can be limited to the main branch (Settings → Environments).
    environment:
      name: production
      url: https://poolcontrol.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Always the newest INSTALLER_VERSIONS releases, whichever tag triggered
      # the run. Re-running an old tag's build therefore can't roll the public
      # installer back to that version.
      - name: Assemble site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./website/build-site.sh --out website/dist --limit "${INSTALLER_VERSIONS:-5}"

      # Uploads website/dist (the [assets] directory in wrangler.toml). A
      # Worker deploy switches over atomically, so visitors never see a mix
      # of old and new files.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4.156.0"
          command: deploy
